# ============================================================
# Spring Boot 主配置文件
# 控制整个项目的运行参数
# ============================================================

server:
  port: 8080

spring:
  application:
    name: tag-query-service

  # --- 数据源配置：连接你的本地 MySQL ---
  datasource:
    url: jdbc:mysql://localhost:3306/tag_query?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root                    # 改成你的 MySQL 用户名
    password: 88888888                    # 改成你的 MySQL 密码
    driver-class-name: com.mysql.cj.jdbc.Driver

  # --- Redis 配置 ---
  redis:
    host: localhost
    port: 6379
    timeout: 500ms            # ⚡ 单条命令超时（Day 4）：P99 秒级预算下单命令不能超 500ms
    lettuce:
      pool:
        max-active: 50
        max-idle: 10
        min-idle: 5

  # --- Flyway：自动建表 ---
  flyway:
    enabled: true                     # 开启 Flyway
    locations: classpath:db/migration # SQL 脚本位置
    baseline-on-migrate: true         # 对已有数据库也能用

  # --- 邮件（Day 8）---
  # 🔐 账号密码用环境变量注入，永不进 git；本地不配则邮件不发送（notify.receivers 为空）
  mail:
    host: smtp.exmail.qq.com
    port: 465
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          ssl:
            enable: true

# --- MyBatis-Plus 配置 ---
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 控制台打印 SQL（开发用）
    map-underscore-to-camel-case: true                       # 下划线 → 驼峰（如 app_key → appKey）
  global-config:
    db-config:
      id-type: auto                   # 主键自增

# --- Prometheus Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus  # 暴露的端点
  metrics:
    export:
      prometheus:
        enabled: true

# --- 日志级别 ---
logging:
  level:
    com.platform.tagquery: DEBUG       # 自己代码的日志级别
    org.mybatis: INFO                  # MyBatis 执行的 SQL

# --- S3 配置（Day 5）---
# 🔐 本地 MinIO 用 minioadmin/minioadmin；生产必须用环境变量注入：access-key: ${S3_AK}
s3:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  region: us-east-1

tag:
  pull:
    local-temp-dir: ./data/pull_tmp     # 拉取文件的本地暂存目录
  query:
    max-batch-size: 1000                # 单次查询 ID 上限

# --- 通知收件人（Day 8），本地留空则不发送邮件 ---
notify:
  receivers: ${NOTIFY_RECEIVERS:}
