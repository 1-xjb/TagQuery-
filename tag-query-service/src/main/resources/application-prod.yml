# ============================================================
# 生产配置（Day 10）—— 所有敏感值一律环境变量注入，无明文密码
# 启动：java -jar tag-query-service.jar --spring.profiles.active=prod
# ============================================================

server:
  port: 8080

spring:
  application:
    name: tag-query-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/tag_query?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER}              # 🔐 环境变量，不进 git
    password: ${DB_PASSWORD}          # 🔐 环境变量，不进 git
    driver-class-name: com.mysql.cj.jdbc.Driver

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 500ms
    lettuce:
      pool:
        max-active: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:465}
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail:
        smtp:
          ssl:
            enable: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true     # 生产关闭 SQL 打印（log-impl 不配置）
  global-config:
    db-config:
      id-type: auto

# Actuator 只暴露 health、prometheus，/actuator/** 部署时网关层加鉴权
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.platform.tagquery: INFO            # 生产 INFO，DEBUG 会打敏感参数

s3:
  endpoint: ${S3_ENDPOINT}
  access-key: ${S3_AK}                     # 🔐 环境变量
  secret-key: ${S3_SK}                     # 🔐 环境变量
  region: ${S3_REGION:us-east-1}

tag:
  pull:
    local-temp-dir: /data/tagquery/pull_tmp
  query:
    max-batch-size: 1000

notify:
  receivers: ${NOTIFY_RECEIVERS}
